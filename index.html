<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bike Maintenance Tracker</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page">
    <div class="header-row">
      <div>
        <h1>Bike Maintenance Tracker</h1>
        <p id="last-synced">Loading…</p>
      </div>
      <button id="refresh-btn" aria-label="Refresh data">↻</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="maintenance" role="tab" aria-selected="true" id="tab-maintenance">Maintenance</button>
      <button class="tab-btn" data-tab="bike-info" role="tab" aria-selected="false" id="tab-bike-info">Bike Info</button>
    </nav>
    <div id="maintenance-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-maintenance">
      <div id="bikes"></div>
    </div>
    <div id="bike-info-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-bike-info" hidden>
      <div id="bike-info"></div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
