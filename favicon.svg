<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <style>
    .bg { fill: #1a1a1a; }
    .fg, .hub { stroke: #f7f7f5; }
    .hub { fill: #f7f7f5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #eaeaea; }
      .fg, .hub { stroke: #16161a; }
      .hub { fill: #16161a; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="46" height="46" rx="10" />

  <!-- bike wheel -->
  <g class="fg" fill="none" stroke-width="2.4" stroke-linecap="round">
    <circle cx="19" cy="30" r="11.5" />
    <line x1="19" y1="30" x2="19" y2="19.2" />
    <line x1="19" y1="30" x2="28.35" y2="24.6" />
    <line x1="19" y1="30" x2="28.35" y2="35.4" />
    <line x1="19" y1="30" x2="19" y2="40.8" />
    <line x1="19" y1="30" x2="9.65" y2="35.4" />
    <line x1="19" y1="30" x2="9.65" y2="24.6" />
  </g>
  <circle class="hub" cx="19" cy="30" r="1.8" stroke="none" />

  <!-- wrench, overlapping the wheel's upper-right edge -->
  <g class="fg" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(21 3) scale(1.05)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
  </g>
</svg>
